<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register as Donor - FoodShare</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <div class="container-narrow mt-2">
        <div class="card">
            <h2 class="text-center mb-1">Register as Donor</h2>
            <p class="text-center text-muted mb-2">Register your food establishment to donate surplus food</p>

            <div id="alert" class="alert"></div>
            <div id="success" class="alert alert-success"></div>

            <form id="donorForm">
                <div class="form-group">
                    <label for="orgName">Organization Name *</label>
                    <input type="text" id="orgName" name="orgName" required placeholder="e.g., ABC College Canteen">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="orgType">Organization Type *</label>
                        <select id="orgType" name="orgType" required>
                            <option value="">Select type</option>
                            <option value="Mess">Mess</option>
                            <option value="Canteen">Canteen</option>
                            <option value="Hotel">Hotel</option>
                            <option value="Restaurant">Restaurant</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="contactPerson">Contact Person *</label>
                        <input type="text" id="contactPerson" name="contactPerson" required placeholder="Full name">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">Phone Number *</label>
                        <input type="tel" id="phone" name="phone" required placeholder="10-digit mobile number" pattern="[6-9][0-9]{9}">
                        <span class="form-hint">10-digit Indian mobile number</span>
                    </div>
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" required placeholder="your@email.com">
                    </div>
                </div>

                <div class="form-group">
                    <label for="address">Address *</label>
                    <input type="text" id="address" name="address" required placeholder="Full address">
                </div>

                <div class="form-group">
                    <label for="city">City *</label>
                    <input type="text" id="city" name="city" required placeholder="City name">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Password *</label>
                        <input type="password" id="password" name="password" required minlength="6" placeholder="Min 6 characters">
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password *</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Re-enter password">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" id="registerBtn">Create Account</button>
            </form>

            <p class="text-center mt-2 text-muted">
                Already have an account? <a href="/login">Sign in here</a>
            </p>
        </div>
    </div>

    <footer class="footer">
        <p>FoodShare — Food Waste Redistribution System &copy; 2026</p>
    </footer>

    <script src="/js/app.js"></script>
    <script src="/js/nav.js"></script>
    <script>
    // Pre-fill city from API
    fetch('/api/city').then(r => r.json()).then(d => {
        const cityInput = document.getElementById('city');
        if (cityInput && d.city) cityInput.value = d.city;
    });

    document.getElementById('donorForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('registerBtn');
        const form = e.target;

        const data = {
            orgName: form.orgName.value.trim(),
            orgType: form.orgType.value,
            contactPerson: form.contactPerson.value.trim(),
            phone: form.phone.value.trim(),
            email: form.email.value.trim(),
            address: form.address.value.trim(),
            city: form.city.value.trim(),
            password: form.password.value,
            confirmPassword: form.confirmPassword.value
        };

        btn.disabled = true;
        btn.textContent = 'Creating account...';
        App.hideAlert('alert');
        App.hideAlert('success');

        try {
            const result = await App.post('/api/auth/register-donor', data);
            document.getElementById('success').innerHTML = result.message + '<br><br><a href="/login" class="btn btn-primary">Go to Login</a>';
            document.getElementById('success').classList.add('show');
            form.style.display = 'none';
        } catch (err) {
            App.showAlert('alert', err.message);
        } finally {
            btn.disabled = false;
            btn.textContent = 'Create Account';
        }
    });
    </script>
</body>
</html>
