<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - FoodShare</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <div class="container">
        <div class="page-header">
            <h1>Manage Users</h1>
            <p>View and manage all registered donors and NGOs</p>
        </div>

        <div id="alert" class="alert"></div>

        <div class="filter-tabs">
            <button class="filter-tab active" data-filter="">All Users</button>
            <button class="filter-tab" data-filter="donor">Donors</button>
            <button class="filter-tab" data-filter="ngo">NGOs</button>
        </div>

        <div id="usersList" class="loading-overlay"><span class="spinner"></span> Loading...</div>
    </div>

    <div class="modal-overlay" id="userModal">
        <div class="modal">
            <div class="modal-header">
                <h3>User Details</h3>
                <button class="modal-close" onclick="App.closeModal('userModal')">&times;</button>
            </div>
            <div class="modal-body" id="userModalBody"></div>
        </div>
    </div>

    <footer class="footer">
        <p>FoodShare — Food Waste Redistribution System &copy; 2026</p>
    </footer>

    <script src="/js/app.js"></script>
    <script src="/js/nav.js"></script>
    <script>
    async function loadUsers(filter = '') {
        try {
            const url = filter ? `/api/admin/users?role=${filter}` : '/api/admin/users';
            const users = await App.get(url);
            const container = document.getElementById('usersList');

            if (users.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-icon">👥</div><p>No users found.</p></div>';
                return;
            }

            let html = '<div class="table-responsive"><table><thead><tr><th>ID</th><th>Name</th><th>Role</th><th>Email</th><th>City</th><th>Status</th><th>Active</th><th>Actions</th></tr></thead><tbody>';
            users.forEach(u => {
                const name = u.name || u.organization_name || u.ngo_name || '—';
                html += `<tr>
                    <td>#${u.id}</td>
                    <td>${name}</td>
                    <td>${App.roleBadge(u.role)}</td>
                    <td>${u.email}</td>
                    <td>${u.city || '—'}</td>
                    <td>${u.verification_status ? App.statusBadge(u.verification_status) : '<span class="badge badge-approved">Admin</span>'}</td>
                    <td>${u.is_active ? '<span class="badge badge-approved">Active</span>' : '<span class="badge badge-rejected">Disabled</span>'}</td>
                    <td>
                        <button class="btn btn-outline btn-sm" onclick="viewUser(${JSON.stringify(u).replace(/"/g, '&quot;')})">View</button>
                        <button class="btn btn-outline btn-sm" onclick="toggleActive(${u.role === 'donor' ? 'donor' : 'ngo'}, ${u.profile_id || u.id})">${u.is_active ? 'Disable' : 'Enable'}</button>
                    </td>
                </tr>`;
            });
            html += '</tbody></table></div>';
            container.innerHTML = html;
        } catch (err) {
            document.getElementById('usersList').innerHTML = '<div class="alert alert-danger show">Failed to load users.</div>';
        }
    }

    function viewUser(user) {
        const body = document.getElementById('userModalBody');
        body.innerHTML = `
            <p><strong>Name:</strong> ${user.name || user.organization_name || user.ngo_name || '—'}</p>
            <p><strong>Role:</strong> ${user.role.charAt(0).toUpperCase() + user.role.slice(1)}</p>
            <p><strong>Email:</strong> ${user.email}</p>
            <p><strong>Contact:</strong> ${user.contact_person || '—'}</p>
            <p><strong>Phone:</strong> ${user.phone || '—'}</p>
            <p><strong>City:</strong> ${user.city || '—'}</p>
            ${user.organization_type ? `<p><strong>Type:</strong> ${user.organization_type}</p>` : ''}
            <p><strong>Status:</strong> ${user.verification_status ? App.statusBadge(user.verification_status) : '<span class="badge badge-approved">Admin</span>'}</p>
            <p><strong>Active:</strong> ${user.is_active ? 'Yes' : 'No'}</p>
            <p><strong>Registered:</strong> ${App.formatDate(user.created_at)}</p>
        `;
        App.openModal('userModal');
    }

    async function toggleActive(type, id) {
        if (!confirm('Toggle account status?')) return;
        try {
            App.hideAlert('alert');
            const endpoint = type === 'donor' ? `/api/admin/donors/${id}/toggle-active` : `/api/admin/ngos/${id}/toggle-active`;
            const result = await App.post(endpoint, {});
            App.showAlert('alert', result.message, 'success');
            loadUsers(document.querySelector('.filter-tab.active').dataset.filter);
        } catch (err) { App.showAlert('alert', err.message); }
    }

    document.querySelectorAll('.filter-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            loadUsers(tab.dataset.filter);
        });
    });

    loadUsers();
    </script>
</body>
</html>
