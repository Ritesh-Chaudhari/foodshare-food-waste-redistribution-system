<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pending Verification - FoodShare</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <div class="container-narrow mt-2">
        <div class="card text-center">
            <div style="font-size:3rem; margin-bottom:0.75rem;">⏳</div>
            <h2>Account Pending Verification</h2>
            <p class="text-muted mt-1">Your donor account is waiting for administrator verification. You will be able to create donations once your account is approved.</p>
            <p class="text-muted">Please check back later or contact the administrator.</p>
            <button data-action="logout" class="btn btn-outline mt-2">Logout</button>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/nav.js"></script>
</body>
</html>
