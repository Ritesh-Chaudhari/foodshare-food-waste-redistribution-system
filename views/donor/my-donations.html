<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Donations - FoodShare</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <div class="container">
        <div class="page-header">
            <h1>My Donations</h1>
            <p>Manage your food donation listings</p>
            <div class="page-actions">
                <a href="/donor/create-donation" class="btn btn-primary btn-sm">+ Create Donation</a>
            </div>
        </div>

        <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">All</button>
            <button class="filter-tab" data-filter="AVAILABLE">Available</button>
            <button class="filter-tab" data-filter="REQUESTED">Requested</button>
            <button class="filter-tab" data-filter="CONFIRMED">Confirmed</button>
            <button class="filter-tab" data-filter="COMPLETED">Completed</button>
            <button class="filter-tab" data-filter="EXPIRED">Expired</button>
        </div>

        <div id="donationsList" class="loading-overlay"><span class="spinner"></span> Loading...</div>
    </div>

    <footer class="footer">
        <p>FoodShare — Food Waste Redistribution System &copy; 2026</p>
    </footer>

    <script src="/js/app.js"></script>
    <script src="/js/nav.js"></script>
    <script>
    let allDonations = [];

    async function loadDonations(filter = 'all') {
        try {
            allDonations = await App.get('/api/donor/donations');

            let filtered = allDonations;
            if (filter !== 'all') {
                filtered = allDonations.filter(d => {
                    const isExpired = d.status === 'EXPIRED' || (d.pickup_deadline && new Date(d.pickup_deadline) <= new Date());
                    if (filter === 'EXPIRED') return isExpired;
                    return d.status === filter && !isExpired;
                });
            }

            const container = document.getElementById('donationsList');
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><p>No donations found.</p></div>';
                return;
            }

            let html = '<div class="table-responsive"><table><thead><tr><th>ID</th><th>Food Description</th><th>Quantity</th><th>Pickup Location</th><th>Pickup Deadline</th><th>Status</th><th>Created</th></tr></thead><tbody>';
            filtered.forEach(d => {
                const isExpired = d.status === 'EXPIRED' || (d.pickup_deadline && new Date(d.pickup_deadline) <= new Date());
                const effectiveStatus = isExpired ? 'EXPIRED' : d.status;
                html += `<tr class="${isExpired ? 'row-expired' : ''}">
                    <td>#${d.id}</td>
                    <td><strong>${d.food_description}</strong></td>
                    <td>${d.quantity}</td>
                    <td>${d.pickup_location}</td>
                    <td class="${isExpired ? 'text-danger' : ''}">
                        ${App.formatDateTime(d.pickup_deadline)}
                        ${isExpired ? '<br><small style="font-weight:600;">(Deadline Passed)</small>' : ''}
                    </td>
                    <td>${App.statusBadge(effectiveStatus)}</td>
                    <td>${App.formatDate(d.created_at)}</td>
                </tr>`;
            });
            html += '</tbody></table></div>';
            container.innerHTML = html;
        } catch (err) {
            document.getElementById('donationsList').innerHTML = '<div class="alert alert-danger show">Failed to load donations.</div>';
        }
    }

    // Filter tabs
    document.querySelectorAll('.filter-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            loadDonations(tab.dataset.filter);
        });
    });

    loadDonations();
    </script>
</body>
</html>
