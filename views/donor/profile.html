<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - FoodShare</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <div class="container-narrow mt-2">
        <div class="card">
            <div class="page-header">
                <h1>Donor Profile</h1>
                <p>Your organization details</p>
            </div>

            <div id="profile" class="loading-overlay"><span class="spinner"></span> Loading...</div>
        </div>
    </div>

    <footer class="footer">
        <p>FoodShare — Food Waste Redistribution System &copy; 2026</p>
    </footer>

    <script src="/js/app.js"></script>
    <script src="/js/nav.js"></script>
    <script>
    async function loadProfile() {
        try {
            const profile = await App.get('/api/donor/profile');
            const container = document.getElementById('profile');
            container.innerHTML = `
                <div class="form-group">
                    <label>Organization Name</label>
                    <div style="padding:0.55rem 0; font-weight:500;">${profile.organization_name}</div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Organization Type</label>
                        <div style="padding:0.55rem 0;">${profile.organization_type}</div>
                    </div>
                    <div class="form-group">
                        <label>Verification Status</label>
                        <div style="padding:0.55rem 0;">${App.statusBadge(profile.verification_status)}</div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Contact Person</label>
                    <div style="padding:0.55rem 0;">${profile.contact_person}</div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Phone</label>
                        <div style="padding:0.55rem 0;">${profile.phone}</div>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <div style="padding:0.55rem 0;">${profile.email}</div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <div style="padding:0.55rem 0;">${profile.address}</div>
                </div>
                <div class="form-group">
                    <label>City</label>
                    <div style="padding:0.55rem 0;">${profile.city}</div>
                </div>
                <div class="form-group">
                    <label>Registered On</label>
                    <div style="padding:0.55rem 0;">${App.formatDate(profile.created_at)}</div>
                </div>
            `;
        } catch (err) {
            document.getElementById('profile').innerHTML = '<div class="alert alert-danger show">Failed to load profile.</div>';
        }
    }
    loadProfile();
    </script>
</body>
</html>
