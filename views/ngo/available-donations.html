<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Donations - FoodShare</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <div class="container">
        <div class="page-header">
            <h1>Surplus Food Donations</h1>
            <p>Browse surplus food posted by donors for collection</p>
        </div>

        <div id="alert" class="alert"></div>

        <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">All Food</button>
            <button class="filter-tab" data-filter="AVAILABLE">Available</button>
            <button class="filter-tab" data-filter="EXPIRED">Expired</button>
        </div>

        <div id="donationsList" class="loading-overlay"><span class="spinner"></span> Loading...</div>
    </div>

    <!-- Donation Detail Modal -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Donation Details</h3>
                <button class="modal-close" onclick="App.closeModal('detailModal')">&times;</button>
            </div>
            <div class="modal-body" id="detailModalBody"></div>
            <div class="modal-footer" id="detailModalFooter"></div>
        </div>
    </div>

    <footer class="footer">
        <p>FoodShare — Food Waste Redistribution System &copy; 2026</p>
    </footer>

    <script src="/js/app.js"></script>
    <script src="/js/nav.js"></script>
    <script>
    let currentFilter = 'all';

    async function loadDonations(filter = 'all') {
        currentFilter = filter;
        const container = document.getElementById('donationsList');
        container.className = 'loading-overlay';
        container.innerHTML = '<span class="spinner"></span> Loading...';

        try {
            const url = filter === 'all' ? '/api/ngo/available-donations' : `/api/ngo/available-donations?status=${filter}`;
            const donations = await App.get(url);
            container.className = '';

            if (donations.length === 0) {
                let msg = 'There are currently no donations in this category.';
                if (filter === 'AVAILABLE') msg = 'There are currently no available donations. Check back later.';
                if (filter === 'EXPIRED') msg = 'There are no expired donations at this time.';
                container.innerHTML = `<div class="empty-state"><div class="empty-icon">🍽️</div><h3>No Donations Found</h3><p>${msg}</p></div>`;
                return;
            }

            let html = '';
            donations.forEach(d => {
                const isExpired = d.status === 'EXPIRED' || (d.pickup_deadline && new Date(d.pickup_deadline) <= new Date());
                const effectiveStatus = isExpired ? 'EXPIRED' : d.status;

                html += `<div class="donation-card ${isExpired ? 'donation-card-expired' : ''}">
                    <div class="donation-card-header">
                        <h3>${d.food_description}</h3>
                        ${App.statusBadge(effectiveStatus)}
                    </div>
                    <div class="donation-card-details">
                        <div class="detail-item"><span class="detail-label">Donor:</span> ${d.donor_name} (${d.donor_type})</div>
                        <div class="detail-item"><span class="detail-label">Quantity:</span> ${d.quantity}</div>
                        <div class="detail-item"><span class="detail-label">Category:</span> ${d.food_category || 'General'}</div>
                        <div class="detail-item"><span class="detail-label">Prep Time:</span> ${d.preparation_time || '—'}</div>
                        <div class="detail-item"><span class="detail-label">Pickup Location:</span> ${d.pickup_location}</div>
                        <div class="detail-item ${isExpired ? 'text-danger' : ''}">
                            <span class="detail-label">Deadline:</span> <strong>${App.formatDateTime(d.pickup_deadline)}</strong>
                        </div>
                    </div>
                    ${d.additional_notes ? `<div class="text-muted" style="font-size:0.85rem; margin-bottom:0.5rem;"><strong>Notes:</strong> ${d.additional_notes}</div>` : ''}

                    ${isExpired ? `
                        <div class="alert alert-danger" style="margin: 0.5rem 0; padding: 0.45rem 0.75rem; font-size: 0.85rem; display: flex; align-items: center; gap: 0.5rem;">
                            <span>⚠️</span> <div><strong>Food Expired:</strong> The pickup deadline has passed. This food cannot be requested.</div>
                        </div>
                    ` : ''}

                    <div class="donation-card-footer">
                        ${isExpired ? `
                            <button class="btn btn-sm" disabled style="opacity: 0.65; cursor: not-allowed; background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; font-weight: 600;" title="This surplus food has expired and cannot be requested">✕ Expired (Cannot Request)</button>
                        ` : `
                            <button class="btn btn-primary btn-sm" onclick="requestDonation(${d.id})">Request Donation</button>
                        `}
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        } catch (err) {
            container.className = '';
            container.innerHTML = '<div class="alert alert-danger show">Failed to load donations.</div>';
        }
    }

    async function requestDonation(donationId) {
        if (!confirm('Are you sure you want to request this donation? You will be requesting the entire quantity.')) return;

        try {
            App.hideAlert('alert');
            const result = await App.post(`/api/ngo/request-donation/${donationId}`, {});
            App.showAlert('alert', result.message, 'success');
            loadDonations(currentFilter);
        } catch (err) {
            App.showAlert('alert', err.message);
        }
    }

    // Tab switching
    document.querySelectorAll('.filter-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            loadDonations(tab.dataset.filter);
        });
    });

    loadDonations('all');
    </script>
</body>
</html>
