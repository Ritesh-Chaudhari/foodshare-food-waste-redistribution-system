<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Collections - FoodShare</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <div class="container">
        <div class="page-header">
            <h1>Active Collections</h1>
            <p>Donations confirmed for your NGO — arrange and complete collection</p>
        </div>

        <div id="alert" class="alert"></div>
        <div id="confirmedList" class="loading-overlay"><span class="spinner"></span> Loading...</div>
    </div>

    <footer class="footer">
        <p>FoodShare — Food Waste Redistribution System &copy; 2026</p>
    </footer>

    <script src="/js/app.js"></script>
    <script src="/js/nav.js"></script>
    <script>
    async function loadConfirmed() {
        try {
            const donations = await App.get('/api/ngo/confirmed');
            const container = document.getElementById('confirmedList');

            if (donations.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><p>No active collections. When a donor confirms your request, the donation will appear here.</p></div>';
                return;
            }

            let html = '';
            donations.forEach(d => {
                const isCollected = d.status === 'COLLECTED';
                html += `<div class="donation-card">
                    <div class="donation-card-header">
                        <h3>${d.food_description}</h3>
                        ${App.statusBadge(d.status)}
                    </div>
                    <div class="donation-card-details">
                        <div class="detail-item"><span class="detail-label">Donor:</span> ${d.donor_name} (${d.donor_type})</div>
                        <div class="detail-item"><span class="detail-label">Quantity:</span> ${d.quantity}</div>
                        <div class="detail-item"><span class="detail-label">Contact:</span> ${d.donor_contact} — ${d.donor_phone}</div>
                        <div class="detail-item"><span class="detail-label">Pickup Location:</span> ${d.pickup_location}</div>
                        <div class="detail-item"><span class="detail-label">Prep Time:</span> ${d.preparation_time || '—'}</div>
                        <div class="detail-item"><span class="detail-label">Deadline:</span> ${App.formatDateTime(d.pickup_deadline)}</div>
                    </div>
                    <div class="donation-card-footer">
                        ${isCollected
                            ? '<span class="badge badge-collected">COLLECTED</span>'
                            : `<button class="btn btn-success" onclick="markCollected(${d.id})">✓ Mark as Collected</button>`
                        }
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        } catch (err) {
            document.getElementById('confirmedList').innerHTML = '<div class="alert alert-danger show">Failed to load confirmed donations.</div>';
        }
    }

    async function markCollected(donationId) {
        if (!confirm('Are you sure you have physically collected this food?')) return;

        try {
            App.hideAlert('alert');
            const result = await App.post(`/api/ngo/mark-collected/${donationId}`, {});
            App.showAlert('alert', result.message, 'success');
            loadConfirmed();
        } catch (err) {
            App.showAlert('alert', err.message);
        }
    }

    loadConfirmed();
    </script>
</body>
</html>
